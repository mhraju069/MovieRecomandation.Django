apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.env.DB_HOST }}
  labels:
    {{- include "popn.labels" . | nindent 4 }}
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: {{ include "popn.name" . }}-db
    app.kubernetes.io/instance: {{ .Release.Name }}
